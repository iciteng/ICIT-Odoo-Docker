[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
dbfilter = ^%d$
admin_passwd = odoo
list_db = True
server_wide_modules = base,web,icit_saas_guard
log_level = info
workers = 0
max_cron_threads = 1
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
