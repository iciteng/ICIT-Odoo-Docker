[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; Database settings
; Multi-tenant routing:
; Odoo replaces %d with the first hostname label (subdomain).
; Example: acme.localhost -> database "acme", beta.localhost -> database "beta".
dbfilter = ^%d$

; db_host = db
; db_port = 5432
; db_user = odoo
; db_password = odoo

; Admin/Master password for database management
; Change this in production!
admin_passwd = admin

; Enable database list (disable in production for security)
list_db = True

; Logging
log_level = info
; logfile = /var/log/odoo/odoo.log

; Performance (adjust for production)
; workers = 0 means use threading (good for dev)
; For production, set workers = (CPU cores * 2) + 1
workers = 0
max_cron_threads = 1

; Memory limits (in bytes)
; Increase these for production with workers > 0
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648

; Request limits
limit_time_cpu = 60
limit_time_real = 120

; Server ports
xmlrpc_port = 8069
longpolling_port = 8072
