[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; ------------------------------------------------------------
; Production multi-tenant database routing
; ------------------------------------------------------------
; %d resolves to the first subdomain from the Host header.
; Example: acme.example.com -> database "acme"
; Ensure each tenant subdomain matches its DB name.
dbfilter = ^%d$

; Hide database manager endpoints in production.
list_db = True
server_wide_modules = base,web,icit_saas_guard

; Behind a reverse proxy (Nginx/Traefik/Caddy/DO App Platform).
; Required to trust X-Forwarded-* headers correctly.
proxy_mode = True

; Master password for DB management tasks.
; Inject via ODOO_ADMIN_PASSWD env var at runtime (see entrypoint.sh).
; admin_passwd is set dynamically by entrypoint.sh

; ------------------------------------------------------------
; Worker/concurrency tuning for DO Managed PostgreSQL
; ------------------------------------------------------------
; 1 GB managed PG has ~22 max connections.
; Formula: (workers + max_cron_threads + 1) * db_maxconn <= 22
; With workers=2, max_cron_threads=1, db_maxconn=5: (2+1+1)*5 = 20 <= 22 ✓
workers = 2
max_cron_threads = 1
db_maxconn = 5

; ------------------------------------------------------------
; Stability and resource limits (per worker)
; ------------------------------------------------------------
; Soft limit triggers graceful recycle, hard limit force-kills.
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560

; Guardrails for long-running requests.
limit_request = 8192
limit_time_cpu = 120
limit_time_real = 300

; Service ports (App Platform exposes 8069 via HTTP_PORT).
xmlrpc_port = 8069
longpolling_port = 8072

; Logging
log_level = info

; ------------------------------------------------------------
; S3/Spaces attachment storage (configured via entrypoint.sh)
; ------------------------------------------------------------
; ir_attachment.location and fs_storage settings are injected
; at runtime by entrypoint.sh based on SPACES_* env vars.
